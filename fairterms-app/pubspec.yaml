name: fairterms
description: FairTerms - Bias detection app for Indian SMEs
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  http: ^1.2.2
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  go_router: ^14.2.7
  printing: ^5.13.1
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  image_picker: ^1.2.1
  image_cropper: ^12.2.1
  shared_preferences: ^2.5.5
  image_cropper_for_web: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
